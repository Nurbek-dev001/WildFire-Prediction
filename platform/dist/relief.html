<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steppe · рельеф и прогноз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./relief.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header class="topbar">
  <a class="wordmark" href="./">steppe<span>.</span></a>
  <nav class="nav" aria-label="Разделы">
    <a href="./">Карта</a>
    <a href="./relief.html" aria-current="page">Рельеф 3D</a>
    <a href="./upgrade/">Модель</a>
    <a href="./alerts/">Пороги тревоги</a>
    <a href="./quality/">Качество данных</a>
  </nav>
  <span class="release" id="release"></span>
</header>

<main class="stage">
  <canvas id="gl" aria-label="Трёхмерная карта Казахстана: рельеф SRTM и прогноз нового пожара. Нажмите на ячейку, чтобы увидеть детали." tabindex="0"></canvas>
  <div class="labels" id="labels" aria-hidden="true"></div>

  <div class="tl">
    <div class="datebar">
      <button class="btn is-icon" id="prev" aria-label="Предыдущий день"><svg><use href="#i-left"/></svg></button>
      <label class="date"><span id="date-label">—</span><input type="date" id="date" aria-label="Дата прогноза"></label>
      <button class="btn is-icon" id="next" aria-label="Следующий день"><svg><use href="#i-right"/></svg></button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="tr">
    <div class="segmented" role="group" aria-label="Вид">
      <button id="view-3d" aria-pressed="true">3D</button>
      <button id="view-top" aria-pressed="false">Сверху</button>
    </div>
    <label class="slider"><span class="label">Высота рельефа ×<b id="exag-label">25</b></span><input type="range" id="exag" min="0" max="60" step="1" value="25"></label>
    <button class="btn" id="reset"><svg><use href="#i-fit"/></svg>Весь Казахстан</button>
    <aside class="cellcard" id="card" hidden></aside>
  </div>

  <div class="bl">
    <div class="legend" id="legend"></div>
  </div>

  <div class="br">
    <span class="chip">Ретроспектива · не оперативный прогноз</span>
    <span>Рельеф SRTM · geoBoundaries / OSM · ODbL</span>
    <span class="hint">Тяните, чтобы вращать · колесо — масштаб · Shift или правая кнопка — сдвиг</span>
  </div>
</main>

<script type="module" src="./relief.js"></script>
</body>
</html>
