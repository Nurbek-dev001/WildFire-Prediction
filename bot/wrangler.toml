# Telegram bot of Wildfire KZ · Steppe on Cloudflare Workers (free plan).
# The deploy workflow (.github/workflows/bot.yml) fills the KV id, the site address and the
# admin chat; the bot token is a Worker secret, never in this file.
name = "steppe-wildfire-bot"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Every 2 minutes during 12:00-21:59 UTC (17:00-02:59 in Kazakhstan): sends the evening summary
# for the next day in batches once a new bulletin is on the site.
[triggers]
crons = ["*/2 12-21 * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://SITE_URL"
ADMIN_CHAT_ID = "ADMIN_CHAT_ID_VALUE"
