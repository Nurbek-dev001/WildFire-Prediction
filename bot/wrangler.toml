# Telegram bot of Wildfire KZ · Steppe on Cloudflare Workers (free plan).
# The deploy workflow (.github/workflows/bot.yml) fills the KV id, the site address and the
# admin chat; the bot token is a Worker secret, never in this file.
name = "steppe-wildfire-bot"
main = "src/worker.js"
compatibility_date = "2024-12-01"
# Fetches to another Worker of the same account through its public workers.dev address are
# refused (error 1042) without this flag; the service binding below is the primary path.
compatibility_flags = ["global_fetch_strictly_public"]

# The site Worker (site/wrangler.toml), read directly rather than over the internet.
[[services]]
binding = "SITE"
service = "steppe-wildfire"

# Every 2 minutes during 00:00-08:59 UTC (05:00-13:59 in Kazakhstan): sends the morning summary
# in batches once a new bulletin is on the site.
[triggers]
crons = ["*/2 0-8 * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://SITE_URL"
ADMIN_CHAT_ID = "ADMIN_CHAT_ID_VALUE"
