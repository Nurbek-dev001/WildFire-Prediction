# Offline demo on SYNTHETIC data (generated by `wildfire-kz synth`). Results produced with
# this configuration describe the synthetic generator only and are NOT findings about
# Kazakhstan.
extends: default.yaml

project:
  raw_dir: data/synthetic_raw
  work_dir: data/work
  run_label: synthetic

grid:
  primary:
    cell_size_m: 10000           # coarser than 5 km to keep the demo laptop-sized
  sensitivity:
    cell_size_m: 2000
    region_bbox_lonlat: [72.0, 49.0, 73.0, 49.6]

sources:
  boundary:
    source_id: SYNTHETIC-boundary
  firms:
    source_id: SYNTHETIC-FIRMS-VIIRS
  era5_land:
    source_id: SYNTHETIC-ERA5-Land
  mod13a2:
    source_id: SYNTHETIC-MOD13A2
    working_resolution_m: 1000
  mcd12q1:
    source_id: SYNTHETIC-MCD12Q1
    working_resolution_m: 500
  srtm:
    source_id: SYNTHETIC-SRTM
    working_resolution_m: 500
    window_size_km: 200
  worldpop:
    source_id: SYNTHETIC-WorldPop
    working_resolution_m: 1000
  settlements:
    source_id: SYNTHETIC-settlements
    snapshots:
      - {snapshot_date: 2014-01-01, path: human/settlements_2014.geojson}
  roads:
    source_id: SYNTHETIC-roads
    snapshots:
      - {snapshot_date: 2014-01-01, path: human/roads_2014-01-01.geojson}
      - {snapshot_date: 2018-01-01, path: human/roads_2018-01-01.geojson}
      - {snapshot_date: 2021-01-01, path: human/roads_2021-01-01.geojson}

sampling:
  eval_negative_fraction: 0.25

models:
  n_trials_ensemble: 15
  n_trials_logistic: 8
  n_trials_spatial_cv: 5

evaluation:
  bootstrap:
    n_resamples: 200

mapping:
  years: [2022, 2023, 2024]
  max_days: 60

synthetic:
  bbox_lonlat: [70.0, 48.0, 76.5, 50.8]
  era5_resolution_deg: 0.5
  modis_resolution_deg: 0.02
  landcover_resolution_deg: 0.01
  dem_tiles: [2, 2]
  worldpop_resolution_deg: 0.02
  n_settlements: 40
  base_ignition_logit: -9.0
  n_industrial_sites: 3
  low_confidence_share: 0.15
  duplicate_share: 0.02
