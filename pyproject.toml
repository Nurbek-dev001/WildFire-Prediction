[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-kz"
version = "0.1.0"
description = "Explainable multisource ML framework for next-day wildfire occurrence-hazard prediction and mapping in Kazakhstan"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Samat Zharylkap" }, { name = "Nurbek Bolarbek" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "xarray>=2024.1",
  "dask>=2024.1",
  "netCDF4>=1.6",
  "geopandas>=1.0",
  "pyogrio>=0.7",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "catboost>=1.2",
  "optuna>=3.5",
  "shap>=0.44",
  "matplotlib>=3.8",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "psutil>=5.9",
]

[project.optional-dependencies]
download = ["cdsapi>=0.7", "requests>=2.31"]
gee = ["earthengine-api>=0.1.390"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8", "pandas-stubs", "types-PyYAML", "types-psutil", "pre-commit>=3.6"]

[project.scripts]
wildfire-kz = "wildfire_kz.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["wildfire_kz"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end tests on synthetic data"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
