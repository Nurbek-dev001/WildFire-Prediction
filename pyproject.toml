[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-kz"
version = "0.1.0"
description = "Auditable next-day vegetation-fire occurrence forecasting for Kazakhstan"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "pydantic>=2.7",
  "PyYAML>=6", "typer>=0.12", "scikit-learn>=1.5", "scipy>=1.13",
  "geopandas>=1.0", "shapely>=2.1", "rasterio>=1.4", "xarray>=2024.6", "dask[array]>=2024.6",
  "xgboost>=2.1", "catboost>=1.2.7", "optuna>=4", "shap>=0.46",
  "matplotlib>=3.9", "psutil>=6", "joblib>=1.4"
]
[project.optional-dependencies]
public = ["omfiles==1.2.0", "s3fs==2026.9.0", "h5netcdf==1.8.1", "h5py==3.16.0", "pydap==3.5.11"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "pandas-stubs", "types-PyYAML", "types-psutil", "pre-commit"]
[project.scripts]
wildfire-kz = "wildfire_kz.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=tmp/pytest"
filterwarnings = ["ignore:X does not have valid feature names:UserWarning"]
[tool.ruff]
line-length = 100
target-version = "py311"
# These files are pinned by SHA-256 in frozen release and test records under runs/
# (public_hindcast source registry, model_stack_v5, independent_2025, model_v6).
# Reformatting them would break the integrity checks that guard those results, so
# they are kept byte-for-byte and left out of lint and format.
extend-exclude = [
  "scripts/acquire_ndvi_2025_direct.py",
  "scripts/develop_model_v6.py",
  "scripts/evaluate_independent_2025.py",
  "src/wildfire_kz/calibration/__init__.py",
  "src/wildfire_kz/data/http_range.py",
  "src/wildfire_kz/data/public_predictors.py",
  "src/wildfire_kz/data/public_study.py",
  "src/wildfire_kz/data/range_cache.py",
  "src/wildfire_kz/evaluation/__init__.py",
  "src/wildfire_kz/events/__init__.py",
  "src/wildfire_kz/fire_weather.py",
  "src/wildfire_kz/independent.py",
  "src/wildfire_kz/model_upgrade.py",
  "src/wildfire_kz/models/__init__.py",
  "src/wildfire_kz/public_evaluation.py",
  "src/wildfire_kz/public_experiment.py",
  "src/wildfire_kz/public_explanation.py",
  "src/wildfire_kz/stacked_model.py",
  "WildFire-Prediction",
  "redesign-shots",
]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.11"
files = ["src/wildfire_kz"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
# Hash-pinned modules (see [tool.ruff] extend-exclude): their code cannot change, so
# their pre-existing typing gaps are accepted rather than fixed.
[[tool.mypy.overrides]]
module = [
  "wildfire_kz.calibration",
  "wildfire_kz.data.http_range",
  "wildfire_kz.data.public_predictors",
  "wildfire_kz.data.public_study",
  "wildfire_kz.data.range_cache",
  "wildfire_kz.evaluation",
  "wildfire_kz.events",
  "wildfire_kz.fire_weather",
  "wildfire_kz.independent",
  "wildfire_kz.model_upgrade",
  "wildfire_kz.models",
  "wildfire_kz.public_evaluation",
  "wildfire_kz.public_experiment",
  "wildfire_kz.public_explanation",
  "wildfire_kz.stacked_model",
]
ignore_errors = true
