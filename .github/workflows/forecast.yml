name: Nightly forecast
# v6 and v7 for the next UTC day, issued in the cloud every night (docs/cloud-setup.md).
# GitHub starts scheduled runs late (often 1-3 hours), so attempts come every 30 minutes from
# 23:05 to 05:35 UTC; a quick check skips every attempt once the day is in the log. The record goes to the
# forecast-log branch (its push time is the external timestamp of each forecast), the site to
# Cloudflare Workers static assets, and the Telegram bot reads the new bulletin from the site.
on:
  schedule:
    - cron: '5,35 23 * * *'
    - cron: '5,35 0-5 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Target UTC day, YYYY-MM-DD (empty: the next day)'
        required: false
      replay:
        description: 'Recompute without a log entry'
        type: boolean
        default: false
  # A push issues the day when it is missing and its window is open, otherwise it replays the
  # latest logged day and redeploys the site: forecast-trigger checks the cloud setup; a change
  # to the site on main reaches the public address at once.
  push:
    branches: [forecast-trigger, main]
    paths: ['platform/dist/**', 'site/**', 'scripts/forecast_daily.py', 'scripts/publish_forecasts.py', 'scripts/push_forecast_log.py', 'src/wildfire_kz/**', '.github/workflows/forecast.yml']

permissions:
  contents: write

concurrency:
  group: nightly-forecast
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  PYTHONUTF8: '1'

jobs:
  # Seconds instead of minutes: reads only the log and decides whether there is work to do.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forecast-log
          sparse-checkout: log.jsonl
          sparse-checkout-cone-mode: false
      - id: decide
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import UTC, datetime, timedelta
          now = datetime.now(UTC)
          target = str((now + timedelta(hours=12)).date())
          done = {json.loads(l)["target_day"] for l in open("log.jsonl") if l.strip()} if os.path.exists("log.jsonl") else set()
          scheduled = os.environ["EVENT"] == "schedule"
          print("run=" + ("false" if scheduled and target in done else "true"))
          PY
        env:
          EVENT: ${{ github.event_name }}
  forecast:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-forecast.txt
      - name: Install the pinned libraries
        run: |
          pip install -r requirements-forecast.txt
          pip install --no-deps -e .
          # The data helpers call curl.exe (Windows); curl on Linux takes the same arguments.
          sudo ln -sf "$(command -v curl)" /usr/local/bin/curl.exe
      - name: Frozen inputs, models and map payloads
        run: |
          git fetch --depth 1 origin forecast-inputs
          git archive FETCH_HEAD -- data runs | tar -x
          git fetch --depth 1 origin site-assets
          git archive FETCH_HEAD -- platform | tar -x
          git config user.name "wildfire-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Code in the form its releases recorded
        run: python scripts/cloud_code_paths.py
      - name: Forecast log
        run: python scripts/push_forecast_log.py --pull
      - name: Restore downloaded inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            runs/forecast_live/gibs
            runs/forecast_live/weather
            data/real/public_predictors/gfs
            data/real/public_predictors/vegetation
          key: forecast-state-${{ github.run_id }}
          restore-keys: forecast-state-
      - name: Forecast
        id: forecast
        continue-on-error: true
        run: |
          args=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # Inside the issue window a missing day is issued (a catch-up that needs no token);
            # otherwise the latest logged day is replayed.
            missing=$(python -c "import json; from datetime import UTC, datetime; from wildfire_kz import forecast_log as fl; now = datetime.now(UTC); day = fl.target_day(now); done = {json.loads(l)['target_day'] for l in open('runs/forecast_live/log.jsonl') if l.strip()}; print(str(day) not in done and fl.window(day)[0] <= now)")
            if [ "$missing" != "True" ]; then
              last=$(python -c "import json;print(json.loads(open('runs/forecast_live/log.jsonl').read().splitlines()[-1])['target_day'])")
              args="--replay --day $last"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "${{ inputs.day }}" ] && args="--day ${{ inputs.day }}"
            [ "${{ inputs.replay }}" = "true" ] && args="$args --replay"
          fi
          set -o pipefail
          mkdir -p runs/forecast_live
          python scripts/forecast_daily.py $args 2>&1 | tee -a runs/forecast_live/runs.log
          python scripts/publish_forecasts.py 2>&1 | tee -a runs/forecast_live/runs.log
      - name: Save downloaded inputs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            runs/forecast_live/gibs
            runs/forecast_live/weather
            data/real/public_predictors/gfs
            data/real/public_predictors/vegetation
          key: forecast-state-${{ github.run_id }}
      - name: Verify the site
        if: steps.forecast.outcome == 'success'
        run: node platform/scripts/verify-live-assets.mjs
      - name: Deploy the site to Cloudflare
        if: steps.forecast.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Cloudflare secrets not set; site not deployed"; exit 0; fi
          set -o pipefail
          # Static assets on Workers (site/wrangler.toml): the same token that deploys the bot.
          npx --yes wrangler@3.99.0 deploy --config site/wrangler.toml 2>&1 | tee -a runs/forecast_live/runs.log
      - name: Publish the record
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/push_forecast_log.py --status "${{ github.event_name }}:${{ steps.forecast.outcome }}:${{ job.status }}"
      - name: Fail when the forecast failed
        if: steps.forecast.outcome != 'success'
        run: exit 1
