name: Research integrity
on:
  push:
    # Data and record branches carry no code.
    branches-ignore: [forecast-inputs, forecast-log, forecast-trigger]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev,public]'
      - run: ruff check . && ruff format --check .
      - run: mypy src/wildfire_kz
      - run: pytest -q
