name: Telegram bot
# Deploys bot/ to Cloudflare Workers, stores the bot token as a Worker secret and registers the
# webhook and command menu. Runs when bot/ changes or by hand (docs/cloud-setup.md).
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

env:
  WRANGLER: wrangler@3.99.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/bot.test.mjs
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          exec > >(tee deploy-all.log) 2>&1
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::notice::Cloudflare or Telegram secrets not set; bot not deployed"; exit 0
          fi
          # Subscriber store: one KV namespace, created on the first deploy.
          id=$(npx --yes $WRANGLER kv namespace list | python3 -c "import json,sys;print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('SUBS')),''))")
          if [ -z "$id" ]; then
            npx --yes $WRANGLER kv namespace create SUBS
            id=$(npx --yes $WRANGLER kv namespace list | python3 -c "import json,sys;print(next(n['id'] for n in json.load(sys.stdin) if n['title'].endswith('SUBS')))")
          fi
          # The site is the steppe-wildfire Worker on the same workers.dev subdomain as the bot.
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          site="https://steppe-wildfire.$sub.workers.dev"
          sed -i "s|KV_NAMESPACE_ID|$id|; s|https://SITE_URL|$site|; s|ADMIN_CHAT_ID_VALUE|${ADMIN_CHAT_ID}|" wrangler.toml
          npx --yes $WRANGLER deploy | tee deploy.log
          printf '%s' "$TELEGRAM_TOKEN" | npx --yes $WRANGLER secret put TELEGRAM_TOKEN
          worker=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)
          key=$(printf 'webhook:%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          curl -fsS "$worker/setup?key=$key" | python3 -c "import json,sys;r=json.load(sys.stdin);print('webhook', r['webhook'].get('ok'), r['webhook'].get('description',''))"
          echo "::notice::Bot deployed at $worker; site $site"
      - name: Record the run on the forecast-log branch
        if: always()
        working-directory: .
        env:
          STATUS_FILE: bot-status.json
          STATUS_LOG: bot/deploy-all.log
        run: |
          git config user.name "wildfire-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/push_forecast_log.py --status "bot:${{ steps.deploy.outcome }}"
